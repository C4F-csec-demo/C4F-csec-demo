<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Challenge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <p><a href="index.html">← Back to challenges</a></p>

    <h1 id="title">Challenge</h1>

    <div id="challenge-content"></div>

    <hr>

    <label for="flag">Enter the flag you found:</label><br>
    <input id="flag" type="text">
    <button onclick="checkFlag()">Submit</button>

    <p id="result"></p>
  </main>

  <script>
    const challenges = {
      "1": {
        title: "Challenge 1 - Love Letter",
        description: `
          <p>Using Python, a student has encrypted a secret message to send to their girlfriend. The code used to encrypt the message can be found in the attached file.</p>
          <p>The program takes each character's ASCII value and multiplies it by 3.</p>
          <p>Can you reverse the process and find the hidden message?</p>

          <p><strong>Encrypted message:</strong></p>
          <pre>315, 324, 363, 294, 294, 363</pre>

          <p><strong>Hint:</strong> You already know what ASCII values are. Work backwards from the encryption.</p>
        `,
        answer: "ilybby"
      },

      "2": {
        title: "Challenge 2 - Inspect HTML",
        description: `
          <p>This webpage looks completely normal...</p>
          <p>But there might be something hidden in the HTML source code.</p>
          <p>Can you inspect this page and find the secret flag?</p>
          <!-- FLAG: code4fun -->
          <p><strong>Hint:</strong> Try viewing the page source.</p>
        `,
        answer: "code4fun"
      }
    };

    const params = new URLSearchParams(window.location.search);
    const id = params.get("id") || "1";
    const challenge = challenges[id] || challenges["1"];

    document.title = challenge.title + " | CODE4FUN Cybersecurity";
    document.getElementById("title").textContent = challenge.title;
    document.getElementById("challenge-content").innerHTML = challenge.description;

    function checkFlag() {
      const submitted = document.getElementById("flag").value.trim().toLowerCase();
      const result = document.getElementById("result");

      if (submitted === challenge.answer.toLowerCase()) {
        result.textContent = "Correct! You found the flag.";
      } else {
        result.textContent = "Not quite. Try again.";
      }
    }
  </script>
</body>
</html>
